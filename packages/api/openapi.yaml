openapi: 3.1.0
info:
  title: Studyo server API
  version: 0.1.0
  description: |
    Contract between the Studyo home server and the Studyo app.

    - The library folder on the server is the source of truth. Every resource the app shows exists as a file.
    - All AI work runs as a **job**. Live changes arrive on `GET /events` (Server-Sent Events). The stream only
      announces changes: everything it carries can also be fetched, so a client that was suspended (iPhone web app)
      catches up by fetching snapshots and replaying from its last event id. See `events.md`.
    - Every call except `GET /health` needs the access token as `Authorization: Bearer <token>`. When the server sits
      behind Cloudflare Access, clients also send `CF-Access-Client-Id` and `CF-Access-Client-Secret`.
    - The server that hosts the web app also serves this API under `/api` on the same origin. Behind Cloudflare
      Access that lets the browser's Access login cookie cover both, so no service token is needed in a browser.
    - Media elements and the Reader's iframe cannot send headers, so files are also served under
      `/f/{file_token}/...`. The file token is derived from the access token, grants read access to files only,
      and is returned by `GET /server`.
    - Behind Cloudflare Access with the app on another hostname, clients get an Access token through
      `GET /auth/access` and send it as `cf-access-token`. Media and the Reader can't send headers, so `/f/*`
      needs an Access bypass rule; the file token protects it.
servers:
  - url: http://localhost:8787
security:
  - bearer: []

tags:
  - name: server
  - name: topics
  - name: courses
  - name: quizzes
  - name: assignments
  - name: files
  - name: progress
  - name: jobs
  - name: chat
  - name: inbox
  - name: profile
  - name: events
  - name: push

paths:
  /health:
    get:
      tags: [server]
      summary: Liveness check. No auth.
      security: []
      operationId: getHealth
      responses:
        '200':
          description: Server is up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /auth/access:
    get:
      tags: [server]
      summary: Cloudflare Access sign-in hand-off for apps on another hostname
      description: |
        Opened in a browser (a full-page redirect on web, an auth session on Android). Cloudflare Access makes
        the person sign in before the request reaches the server, then forwards it with their Access token. The
        server redirects to `return` with `#cf_token=<token>`. The app then sends `cf-access-token: <token>` on
        every request, which Access accepts in place of its cookie.

        `return` must be the app's scheme (`studyo://`), a localhost address, or an origin listed in
        `STUDYO_ORIGINS` or `STUDYO_APP_URLS`.
      security: []
      operationId: accessHandoff
      parameters:
        - name: return
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Back to the app with the token in the URL fragment
        '400':
          description: 'Not behind Access, or the return address is not allowed (an HTML page)'
          content:
            text/html:
              schema: { type: string }

  /server:
    get:
      tags: [server]
      summary: Server info, available CLIs and the file token
      operationId: getServerInfo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /settings:
    get:
      tags: [server]
      summary: Server settings
      operationId: getSettings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [server]
      summary: Change server settings, such as which CLI runs jobs
      operationId: putSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Settings' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /topics:
    get:
      tags: [topics]
      summary: Home data, the topic list with the Continue item and the inbox count
      operationId: listTopics
      parameters:
        - name: include_archived
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopicList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [topics]
      summary: Create a topic from a link, an uploaded PDF or a name
      description: |
        JSON for a link or a name; multipart for a PDF. When `enrich` is true the server queues an enrich job and
        returns it.
      operationId: createTopic
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTopic' }
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                title: { type: string }
                enrich: { type: boolean, default: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopicWithJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /topics/{topic_id}:
    parameters:
      - $ref: '#/components/parameters/TopicId'
    get:
      tags: [topics]
      summary: One topic with its manifest, progress and jobs
      operationId: getTopic
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopicDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [topics]
      summary: Rename, archive or unarchive, or reorder resources
      operationId: updateTopic
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTopic' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topic' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /topics/{topic_id}/resources:
    parameters:
      - $ref: '#/components/parameters/TopicId'
    post:
      tags: [topics]
      summary: Upload a file (audio, video, document) into the topic's outputs
      operationId: uploadResource
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                title: { type: string }
                made_with:
                  type: string
                  description: For example NotebookLM
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /topics/{topic_id}/resources/chunks:
    parameters:
      - $ref: '#/components/parameters/TopicId'
    post:
      tags: [topics]
      summary: Add a large file in pieces
      description: |
        For files too big for one request (a proxy such as Cloudflare caps a request body at 100 MB on its free
        plan). Send the pieces in order as the raw request body (`application/octet-stream`), about 16 MB each,
        with the same `upload_id` and `name`, the `offset` of the piece's first byte and the file's `total` size.
        Pieces are appended in order. A piece the server already has is accepted again, so a failed request can
        be retried. The reply to the last piece is the new resource, as for `POST /topics/{topic_id}/resources`;
        earlier pieces get the bytes received so far.
      operationId: addResourceChunk
      parameters:
        - { name: upload_id, in: query, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,64}$' } }
        - { name: name, in: query, required: true, schema: { type: string }, description: The file name }
        - { name: offset, in: query, required: true, schema: { type: integer, minimum: 0 } }
        - { name: total, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: title, in: query, schema: { type: string } }
        - { name: made_with, in: query, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Piece stored, more to come
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received: { type: integer, description: Bytes stored so far }
        '201':
          description: The last piece arrived and the resource was added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /topics/{topic_id}/resources/{resource_id}/rendered:
    parameters:
      - $ref: '#/components/parameters/TopicId'
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [topics]
      summary: Make sure a pack or condensed doc has fresh HTML, and return where it is
      description: Renders the Markdown when the HTML is missing, older than the Markdown, or from an older renderer.
      operationId: getRendered
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rendered' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The Markdown could not be rendered (unknown directive, missing asset)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /topics/{topic_id}/resources/{resource_id}/pdf:
    parameters:
      - $ref: '#/components/parameters/TopicId'
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [topics]
      summary: Make sure a pack or condensed doc has a fresh PDF, and return where it is
      description: |
        Prints the rendered page to PDF (light theme, A4, diagrams and maths included) and saves it next to the
        Markdown. Re-made when the Markdown or the renderer changes. Download it with
        `/f/{file_token}/{pdf_path}?download=<file name>`, which sends it as an attachment.
      operationId: getPdf
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pdf' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The document could not be rendered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: PDF printing is not available on this server (no Chromium)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /topics/{topic_id}/mark-read:
    parameters:
      - $ref: '#/components/parameters/TopicId'
    post:
      tags: [topics, profile]
      summary: Mark the topic as read. Adds its gap concepts to the profile with `via read`.
      operationId: markTopicRead
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /files/{path}:
    get:
      tags: [files]
      summary: Serve a library file. Supports Range requests so media can stream and seek.
      operationId: getFile
      parameters:
        - $ref: '#/components/parameters/FilePath'
        - $ref: '#/components/parameters/Range'
        - $ref: '#/components/parameters/Download'
      responses:
        '200': { $ref: '#/components/responses/File' }
        '206': { $ref: '#/components/responses/PartialFile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '416':
          description: Range not satisfiable

  /f/{file_token}/{path}:
    get:
      tags: [files]
      summary: Same as `/files/{path}`, authorised by the file token in the path
      description: |
        For `<audio>`, `<video>`, `<img>` and the Reader iframe. Because the token is part of the path, relative links
        inside rendered HTML (images, shared assets) resolve under it and keep working.
      operationId: getFileWithToken
      security: []
      parameters:
        - name: file_token
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/FilePath'
        - $ref: '#/components/parameters/Range'
        - $ref: '#/components/parameters/Download'
      responses:
        '200': { $ref: '#/components/responses/File' }
        '206': { $ref: '#/components/responses/PartialFile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '416':
          description: Range not satisfiable

  /topics/{topic_id}/progress:
    parameters:
      - $ref: '#/components/parameters/TopicId'
    get:
      tags: [progress]
      summary: Playback and reading progress for a topic
      operationId: getProgress
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Progress' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [progress]
      summary: Save positions and done marks. Per item, the most recent `updated` wins.
      operationId: putProgress
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgressUpdate' }
      responses:
        '200':
          description: The merged progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Progress' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /topics/{topic_id}/bookmarks:
    parameters:
      - $ref: '#/components/parameters/TopicId'
    post:
      tags: [progress]
      summary: Bookmark a moment in an audio or video file
      operationId: addBookmark
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBookmark' }
      responses:
        '201':
          description: Added; returns the topic's progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Progress' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /topics/{topic_id}/bookmarks/{bookmark_id}:
    parameters:
      - $ref: '#/components/parameters/TopicId'
      - name: bookmark_id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [progress]
      summary: Remove a bookmark
      operationId: deleteBookmark
      responses:
        '200':
          description: Removed; returns the topic's progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Progress' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /topics/{topic_id}/jobs:
    parameters:
      - $ref: '#/components/parameters/TopicId'
    post:
      tags: [jobs]
      summary: Start an enrich, deep enrich or condense job
      operationId: createJob
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateJob' }
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /jobs:
    get:
      tags: [jobs]
      summary: List jobs. The app calls `?active=true` on every resume.
      operationId: listJobs
      parameters:
        - name: active
          in: query
          description: Only queued, running and needs_input jobs
          schema: { type: boolean, default: false }
        - name: topic_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /jobs/{job_id}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [jobs]
      summary: Job state and its recent log lines
      operationId: getJob
      parameters:
        - name: log_lines
          in: query
          schema: { type: integer, default: 200, maximum: 2000 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /jobs/{job_id}/answers:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [jobs]
      summary: Answer a job's questions. The server resumes the CLI session with them.
      operationId: answerJob
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnswerSet' }
      responses:
        '202':
          description: Accepted; the job is queued to resume
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /jobs/{job_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [jobs]
      summary: Cancel a queued, running or waiting job
      operationId: cancelJob
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /topics/{topic_id}/chat:
    parameters:
      - $ref: '#/components/parameters/TopicId'
    get:
      tags: [chat]
      summary: The topic's conversation
      operationId: getChat
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatHistory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [chat]
      summary: Send a message
      description: |
        Saves the question, creates an empty assistant message and queues an `answer` job in the chat lane. The reply
        streams as `chat.delta` events and is saved as it grows, so a client that reconnects mid-reply sees all of
        it. Refused with 409 while the topic is enriching or condensing, because the job holds the topic's session.
      operationId: sendChat
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendChat' }
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatTurn' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /courses:
    get:
      tags: [courses]
      summary: All courses, with how far through each and what to study next
      operationId: listCourses
      parameters:
        - name: include_archived
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [courses]
      summary: Create a course from a PDF, a link or a subject name
      description: |
        JSON for a link or a name; multipart for a PDF. The server queues a `course-outline` job: it finds the
        chapters (without reading the whole source), asks the learner to approve the outline, then asks what they
        already know to set up the Prelim. A subject name with no source runs the `course-plan` skill, which looks for
        a syllabus or standard textbook to use as the spine. A scanned PDF with no text layer is not supported: the job
        fails with a plain reason.
      operationId: createCourse
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCourse' }
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                title: { type: string }
                goal: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseWithJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /courses/{course_id}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [courses]
      summary: One course with its chapters, their states and its jobs
      operationId: getCourse
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [courses]
      summary: Rename, change the goal, archive or unarchive
      operationId: updateCourse
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCourse' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Course' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /courses/{course_id}/outline:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    post:
      tags: [courses]
      summary: Run the outline job again after a failure or a cancel
      description: Refused with 409 once an outline has been approved, because chapters may already be built.
      operationId: redoCourseOutline
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /courses/{course_id}/build:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    post:
      tags: [courses]
      summary: Queue chapter builds
      description: |
        Chapters are built lazily. Give `chapter_ids` to build those, or `next` to build the next N planned chapters in
        course order. Each build is a normal `enrich` job on the chapter. The work lane runs them one at a time.
      operationId: buildChapters
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BuildChapters' }
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /courses/{course_id}/chapters/{chapter_id}/complete:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - name: chapter_id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [courses]
      summary: Mark a chapter done, or not done
      description: |
        Marks the chapter's pack as read and, when done, adds what the chapter teaches to the person profile
        (`via: read`). Prerequisites advise: nothing is locked, but unfinished prerequisites are listed on the chapter.
      operationId: completeChapter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [done]
              properties:
                done: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /topics/{topic_id}/quizzes:
    parameters:
      - $ref: '#/components/parameters/TopicId'
    get:
      tags: [quizzes]
      summary: Quizzes made for a topic, chapter or course
      description: '`topic_id` may also be a course scope id (`course--<id>`), which gives cumulative course quizzes.'
      operationId: listQuizzes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuizList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [quizzes]
      summary: Make a quiz (only when the learner asks)
      description: Queues a `quiz` job. The quiz appears with status `generating` and becomes `ready` when the job ends.
      operationId: createQuiz
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateQuiz' }
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuizWithJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /topics/{topic_id}/quizzes/{quiz_id}:
    parameters:
      - $ref: '#/components/parameters/TopicId'
      - $ref: '#/components/parameters/QuizId'
    get:
      tags: [quizzes]
      summary: One quiz with its attempts. Answers are not included until an attempt is graded.
      operationId: getQuiz
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quiz' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [quizzes]
      summary: Delete a quiz
      operationId: deleteQuiz
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /topics/{topic_id}/quizzes/{quiz_id}/attempts:
    parameters:
      - $ref: '#/components/parameters/TopicId'
      - $ref: '#/components/parameters/QuizId'
    post:
      tags: [quizzes]
      summary: Submit answers
      description: |
        Choice questions are graded at once on the server. Short-answer and explain questions are graded by a
        `quiz-grade` job in the chat lane; the attempt is `grading` until it finishes.
      operationId: submitQuizAttempt
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitAttempt' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuizAttempt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /topics/{topic_id}/assignments:
    parameters:
      - $ref: '#/components/parameters/TopicId'
    get:
      tags: [assignments]
      summary: Take-home assignments for a topic or chapter
      operationId: listAssignments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [assignments]
      summary: Make a take-home assignment (only when the learner asks)
      description: |
        Optional context makes the task about something the learner cares about: a project they are building, a
        situation at work, a link or a file. With no context the AI writes a generic task. JSON for text and a link,
        multipart to attach a file. Queues an `assignment` job.
      operationId: createAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAssignment' }
          multipart/form-data:
            schema:
              type: object
              properties:
                context_text: { type: string }
                context_link: { type: string }
                context_file: { type: string, format: binary }
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentWithJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /topics/{topic_id}/assignments/{assignment_id}:
    parameters:
      - $ref: '#/components/parameters/TopicId'
      - $ref: '#/components/parameters/AssignmentId'
    get:
      tags: [assignments]
      summary: One assignment with its brief, submissions and reviews
      operationId: getAssignment
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [assignments]
      summary: Delete an assignment
      operationId: deleteAssignment
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /topics/{topic_id}/assignments/{assignment_id}/submissions:
    parameters:
      - $ref: '#/components/parameters/TopicId'
      - $ref: '#/components/parameters/AssignmentId'
    post:
      tags: [assignments]
      summary: Submit work
      description: |
        Free text ("I built X, here is how"), a public link (a GitHub repository, a deployed page) or a file. Queues
        an `assignment-review` job. Submitted code is read and reviewed, never run.
      operationId: submitAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSubmission' }
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                text: { type: string }
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /inbox:
    get:
      tags: [inbox]
      summary: Files in `library/inbox/` that belong to no topic
      operationId: listInbox
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [inbox]
      summary: Upload a file into the inbox
      operationId: uploadInbox
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /inbox/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: The file name inside `library/inbox/`
        schema: { type: string }
    patch:
      tags: [inbox]
      summary: Rename an inbox file
      operationId: renameInbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1 }
      responses:
        '200':
          description: Renamed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [inbox]
      summary: Delete an inbox file
      operationId: deleteInbox
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /inbox/assign:
    post:
      tags: [inbox]
      summary: Move an inbox file into an existing topic, or start a new topic from it
      operationId: assignInbox
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignInbox' }
      responses:
        '200':
          description: Moved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopicWithJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /profile:
    get:
      tags: [profile]
      summary: The person profile (`library/profile.md`)
      operationId: getProfile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [profile]
      summary: Replace the person profile
      operationId: putProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Profile' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /events:
    get:
      tags: [events]
      summary: Live event stream (Server-Sent Events)
      description: |
        `text/event-stream`. Each message has `id:` (an increasing integer), `event:` (the type) and `data:` (JSON,
        see `Event`). A comment line (`: ping`) is sent every 20 seconds. To replay what was missed, pass the last id
        as `Last-Event-ID` or `?after=`. If the id is older than the retained log, the server sends `resync` first
        and the client must refetch its snapshots.
      operationId: streamEvents
      parameters:
        - name: after
          in: query
          schema: { type: integer }
        - name: Last-Event-ID
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Stream
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/Event' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /push/key:
    get:
      tags: [push]
      summary: VAPID public key for Web Push
      operationId: getPushKey
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [public_key]
                properties:
                  public_key: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /push/subscriptions:
    post:
      tags: [push]
      summary: Register a Web Push subscription
      operationId: addPushSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushSubscription' }
      responses:
        '204': { description: Saved }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [push]
      summary: Remove a Web Push subscription
      operationId: removePushSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string }
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer

  parameters:
    TopicId:
      name: topic_id
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]*$' }
    CourseId:
      name: course_id
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]*$' }
    QuizId:
      name: quiz_id
      in: path
      required: true
      schema: { type: string }
    AssignmentId:
      name: assignment_id
      in: path
      required: true
      schema: { type: string }
    ResourceId:
      name: resource_id
      in: path
      required: true
      schema: { type: string }
    JobId:
      name: job_id
      in: path
      required: true
      schema: { type: string }
    FilePath:
      name: path
      in: path
      required: true
      description: Path relative to the library root, for example `topics/pc-ca-mcts/pack/pack.html`. May contain slashes.
      schema: { type: string }
    Download:
      name: download
      in: query
      description: Send the file as an attachment with this file name, instead of inline.
      schema: { type: string }
    Range:
      name: Range
      in: header
      schema: { type: string, example: 'bytes=0-1023' }

  responses:
    File:
      description: Whole file
      headers:
        Accept-Ranges: { schema: { type: string, const: bytes } }
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
    PartialFile:
      description: Partial content
      headers:
        Content-Range: { schema: { type: string } }
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or wrong token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Not allowed in the current state (for example a job already running on the topic)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string, description: One plain sentence the app can show }

    Health:
      type: object
      required: [ok, name, version]
      properties:
        ok: { type: boolean }
        name: { type: string, const: studyo }
        version: { type: string }

    CliId:
      type: string
      enum: [claude, opencode]

    CliInfo:
      type: object
      required: [id, label, installed]
      properties:
        id: { $ref: '#/components/schemas/CliId' }
        label: { type: string }
        installed: { type: boolean }
        version: { type: [string, 'null'] }

    ServerInfo:
      type: object
      required: [version, file_token, clis, settings, storage]
      properties:
        version: { type: string }
        file_token: { type: string }
        clis:
          type: array
          items: { $ref: '#/components/schemas/CliInfo' }
        settings: { $ref: '#/components/schemas/Settings' }
        storage:
          type: object
          required: [library_bytes]
          properties:
            library_bytes: { type: integer }

    Settings:
      type: object
      required: [cli]
      properties:
        cli: { $ref: '#/components/schemas/CliId' }
        models:
          type: object
          description: Optional model per CLI. Empty means the CLI's default.
          properties:
            claude: { type: [string, 'null'] }
            opencode: { type: [string, 'null'], description: 'provider/model' }

    TopicStatus:
      type: string
      enum: [captured, enriching, ready, failed, archived]

    Origin:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [link, pdf, topic, chapter]
        course_id: { type: string, description: 'When type is chapter, the course it belongs to' }
        link: { type: string, description: When type is link }
        name: { type: string, description: When type is topic }
        file: { type: string, description: 'When type is pdf, the path inside the topic folder' }

    ResourceType:
      type: string
      enum: [source, pack, condensed, audio, video]

    Resource:
      type: object
      required: [id, type, title, path]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/ResourceType' }
        title: { type: string }
        path: { type: string, description: Relative to the topic folder }
        made_with: { type: [string, 'null'] }
        duration: { type: [number, 'null'], description: 'Seconds, for audio and video' }
        size: { type: [integer, 'null'], description: Bytes }
        added: { type: string, description: ISO date or date-time }
        html_path:
          type: [string, 'null']
          description: Derived by the server. Path of the rendered HTML next to a pack or condensed `.md`, when it exists.
        url:
          type: [string, 'null']
          description: Derived by the server. For a source saved from the web, its original URL (from the ledger).
        chapters:
          description: Derived by the server for audio and video, from the file's own chapter markers.
          oneOf:
            - type: array
              items:
                type: object
                required: [title, start]
                properties:
                  title: { type: string }
                  start: { type: number, description: Seconds }
            - type: 'null'
        description:
          type: [string, 'null']
          description: |
            Derived by the server for packs and condensed docs: the front matter `description`, or else the first
            paragraph, shortened.
        read_minutes:
          type: [integer, 'null']
          description: Derived by the server for packs and condensed docs, at about 230 words a minute.

    Learning:
      type: object
      properties:
        goal: { type: string }
        gaps:
          type: array
          items: { type: string }
        updated: { type: string }

    Topic:
      type: object
      description: The topic manifest (`topic.json`) as the server sees it, after auto-discovery.
      required: [id, title, status, origin, resources, created, updated]
      properties:
        id: { type: string }
        title: { type: string }
        status: { $ref: '#/components/schemas/TopicStatus' }
        origin: { $ref: '#/components/schemas/Origin' }
        session_id:
          type: [string, 'null']
          description: The CLI session used for enrichment and chat
        session_cli:
          oneOf:
            - $ref: '#/components/schemas/CliId'
            - type: 'null'
          description: Which CLI the session belongs to
        resources:
          type: array
          items: { $ref: '#/components/schemas/Resource' }
        cover_path:
          type: [string, 'null']
          description: Derived by the server. The first figure in the pack (or a condensed doc), relative to the topic folder, for cover art.
        learning:
          oneOf:
            - $ref: '#/components/schemas/Learning'
            - type: 'null'
        course:
          description: Set when this topic is a chapter (or the Prelim) of a course. The topic list includes chapters, marked with `course_id`; Home shows them under their course instead.
          oneOf:
            - $ref: '#/components/schemas/ChapterRef'
            - type: 'null'
        failure_reason: { type: [string, 'null'] }
        summary:
          type: [string, 'null']
          description: One sentence on what the topic is. Written by the enrich skills; falls back to the pack's description.
        created: { type: string }
        updated: { type: string }

    TopicSummary:
      type: object
      required: [id, title, status, origin, counts, progress, updated]
      properties:
        id: { type: string }
        course_id: { type: [string, 'null'], description: 'The course this chapter belongs to, if any' }
        title: { type: string }
        status: { $ref: '#/components/schemas/TopicStatus' }
        origin: { $ref: '#/components/schemas/Origin' }
        counts:
          type: object
          required: [sources, docs, media]
          properties:
            sources: { type: integer }
            docs: { type: integer, description: Pack plus condensed docs }
            media: { type: integer }
        summary: { type: [string, 'null'] }
        progress:
          type: object
          required: [done, total, fraction]
          properties:
            done: { type: integer, description: Docs and media marked done }
            total: { type: integer }
            fraction:
              type: number
              description: How far through the topic's docs and media, 0–1 (each item weighted equally)
        failure_reason: { type: [string, 'null'] }
        active_job:
          oneOf:
            - $ref: '#/components/schemas/Job'
            - type: 'null'
        updated: { type: string }

    ContinueItem:
      type: object
      description: The most recent unfinished audio, video or condensed doc. Study packs never appear here.
      required: [topic_id, topic_title, resource, item]
      properties:
        topic_id: { type: string }
        topic_title: { type: string }
        resource: { $ref: '#/components/schemas/Resource' }
        item: { $ref: '#/components/schemas/ProgressItem' }

    TopicList:
      type: object
      required: [topics, continue, inbox_count]
      properties:
        topics:
          type: array
          items: { $ref: '#/components/schemas/TopicSummary' }
        continue:
          oneOf:
            - $ref: '#/components/schemas/ContinueItem'
            - type: 'null'
        inbox_count: { type: integer }

    TopicDetail:
      type: object
      required: [topic, progress, jobs]
      properties:
        topic: { $ref: '#/components/schemas/Topic' }
        progress: { $ref: '#/components/schemas/Progress' }
        jobs:
          type: array
          description: Active jobs first, then the most recent finished ones
          items: { $ref: '#/components/schemas/Job' }

    TopicWithJob:
      type: object
      required: [topic, job]
      properties:
        topic: { $ref: '#/components/schemas/Topic' }
        job:
          oneOf:
            - $ref: '#/components/schemas/Job'
            - type: 'null'

    CreateTopic:
      type: object
      required: [origin]
      properties:
        origin:
          type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [link, topic]
            link: { type: string, format: uri }
            name: { type: string, minLength: 2 }
        title: { type: string }
        enrich: { type: boolean, default: true }

    UpdateTopic:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        archived: { type: boolean }
        resource_order:
          type: array
          description: Resource ids in the new order. Ids not listed keep their relative order at the end.
          items: { type: string }

    Pdf:
      type: object
      required: [pdf_path, file_name]
      properties:
        pdf_path: { type: string, description: Relative to the library root }
        file_name: { type: string, description: 'A readable file name for downloading, from the document title' }

    Rendered:
      type: object
      required: [html_path, renderer_version, headings]
      properties:
        html_path: { type: string, description: Relative to the library root }
        renderer_version: { type: string }
        headings:
          type: array
          description: The document outline. Ids are stable anchors for reading position, chat links and condense scope.
          items:
            type: object
            required: [id, depth, text]
            properties:
              id: { type: string }
              depth: { type: integer, minimum: 1, maximum: 6 }
              text: { type: string }

    ProgressItem:
      type: object
      required: [position, done, updated]
      properties:
        position:
          type: number
          description: Seconds for audio and video; a 0–1 fraction of the page for documents
        duration: { type: [number, 'null'], description: 'Seconds, for media' }
        section: { type: [string, 'null'], description: 'Heading id the reader was in, for documents' }
        done: { type: boolean }
        updated: { type: string, format: date-time }

    Bookmark:
      type: object
      required: [id, resource_id, position, created]
      properties:
        id: { type: string }
        resource_id: { type: string }
        position: { type: number, description: Seconds into the audio or video }
        note: { type: [string, 'null'] }
        created: { type: string, format: date-time }

    CreateBookmark:
      type: object
      required: [resource_id, position]
      properties:
        resource_id: { type: string }
        position: { type: number }
        note: { type: string }

    Progress:
      type: object
      required: [items, last, bookmarks]
      properties:
        items:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ProgressItem' }
        bookmarks:
          type: array
          description: Timestamps the learner marked while listening, oldest first. Kept in progress.json.
          items: { $ref: '#/components/schemas/Bookmark' }
        last:
          description: The item most recently played or read in this topic
          oneOf:
            - type: object
              required: [resource_id, updated]
              properties:
                resource_id: { type: string }
                updated: { type: string, format: date-time }
            - type: 'null'

    ProgressUpdate:
      type: object
      required: [resource_id, position, updated]
      properties:
        resource_id: { type: string }
        position: { type: number }
        duration: { type: [number, 'null'] }
        section: { type: [string, 'null'] }
        done: { type: boolean }
        updated:
          type: string
          format: date-time
          description: When the change happened on the device. An older update than the stored one is ignored.

    JobKind:
      type: string
      enum: [enrich, enrich-deep, condense, answer, course-outline, quiz, quiz-grade, assignment, assignment-review]

    JobStatus:
      type: string
      enum: [queued, running, needs_input, succeeded, failed, cancelled]

    Job:
      type: object
      required: [id, kind, topic_id, lane, status, cli, created]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/JobKind' }
        topic_id:
          type: string
          description: The topic the job works on. For course-level jobs (outline, course chat, course quiz) it is the course scope id, `course--<course id>`.
        lane:
          type: string
          enum: [work, chat]
          description: Work jobs run one at a time; chat (and quiz grading) runs in its own lane so questions don't wait behind enrichment.
        status: { $ref: '#/components/schemas/JobStatus' }
        cli: { $ref: '#/components/schemas/CliId' }
        params:
          type: object
          description: Skill parameters, for example scope for condense
          additionalProperties: true
        activity:
          type: [string, 'null']
          description: The latest human-readable progress line
        step:
          description: Where the skill is in its numbered steps, from progress lines like `[studyo] 6/9 sources …`
          oneOf:
            - type: object
              required: [n, of]
              properties:
                n: { type: integer }
                of: { type: integer }
            - type: 'null'
        questions:
          oneOf:
            - $ref: '#/components/schemas/QuestionSet'
            - type: 'null'
        error: { type: [string, 'null'] }
        suggest_enrich:
          type: [string, 'null']
          description: For answer jobs, a focus the reply offered to enrich
        created: { type: string, format: date-time }
        started: { type: [string, 'null'], format: date-time }
        finished: { type: [string, 'null'], format: date-time }

    JobList:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          items: { $ref: '#/components/schemas/Job' }

    LogLine:
      type: object
      required: [seq, at, kind, text]
      properties:
        seq: { type: integer }
        at: { type: string, format: date-time }
        kind:
          type: string
          enum: [progress, tool, text, stderr, system]
          description: progress is a `[studyo]` line from a skill; tool is a tool call; text is model output
        text: { type: string }

    JobDetail:
      allOf:
        - $ref: '#/components/schemas/Job'
        - type: object
          required: [log]
          properties:
            log:
              type: array
              items: { $ref: '#/components/schemas/LogLine' }

    CreateJob:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [enrich, enrich-deep, condense]
        scope:
          description: For condense, `all` or a list of pack section ids
          oneOf:
            - type: string
              const: all
            - type: array
              items: { type: string }
        focus: { type: string, description: 'For enrich-deep, what to go deeper on' }

    QuestionSet:
      type: object
      description: Written by a skill when it needs the learner. The job waits in needs_input until answered.
      required: [id, questions, asked]
      properties:
        id: { type: string }
        title: { type: string }
        intro: { type: string }
        questions:
          type: array
          items: { $ref: '#/components/schemas/Question' }
        asked: { type: string, format: date-time }

    Question:
      type: object
      required: [id, kind, label]
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [multi, single, text]
        label: { type: string }
        help: { type: string }
        required: { type: boolean, default: false }
        placeholder: { type: string }
        options:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string }
              label: { type: string }
              group: { type: string, description: Heading to group options under }
              checked: { type: boolean, description: Pre-selected }
              note: { type: string, description: 'Why it is pre-selected, or what it builds on' }

    AnswerSet:
      type: object
      required: [question_set_id, answers]
      properties:
        question_set_id: { type: string }
        answers:
          type: object
          additionalProperties:
            type: object
            properties:
              selected:
                type: array
                items: { type: string }
              text: { type: string }

    ChatMessage:
      type: object
      required: [id, role, text, status, created]
      properties:
        id: { type: string }
        role:
          type: string
          enum: [user, assistant]
        text: { type: string, description: Markdown with reference-style citations }
        status:
          type: string
          enum: [pending, streaming, complete, failed]
        job_id: { type: [string, 'null'] }
        suggest_enrich: { type: [string, 'null'] }
        error: { type: [string, 'null'] }
        created: { type: string, format: date-time }

    ChatHistory:
      type: object
      required: [messages, available]
      properties:
        messages:
          type: array
          items: { $ref: '#/components/schemas/ChatMessage' }
        available:
          type: boolean
          description: False while a work job holds the topic's session, or when there is no pack yet
        unavailable_reason: { type: [string, 'null'] }

    SendChat:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1 }

    ChatTurn:
      type: object
      required: [user, assistant, job]
      properties:
        user: { $ref: '#/components/schemas/ChatMessage' }
        assistant: { $ref: '#/components/schemas/ChatMessage' }
        job: { $ref: '#/components/schemas/Job' }

    InboxItem:
      type: object
      required: [path, name, kind, size, added]
      properties:
        path: { type: string, description: Relative to the library root }
        name: { type: string }
        kind:
          type: string
          enum: [pdf, audio, video, document, other]
        size: { type: integer }
        added: { type: string, format: date-time }

    InboxList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/InboxItem' }

    AssignInbox:
      type: object
      required: [path]
      properties:
        path: { type: string }
        topic_id: { type: string, description: Move into this topic }
        new_topic:
          type: object
          description: Or start a new topic from the file (PDFs become the topic's origin)
          properties:
            title: { type: string }
            enrich: { type: boolean, default: true }

    KnowsEntry:
      type: object
      required: [term, via]
      properties:
        term: { type: string }
        via:
          type: string
          enum: [self-reported, inferred, read, forgot]
        topic: { type: string }
        date: { type: string }

    Profile:
      type: object
      required: [knows, notes]
      properties:
        knows:
          type: array
          items: { $ref: '#/components/schemas/KnowsEntry' }
        notes: { type: string, description: The free-text Markdown body }

    PushSubscription:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string }
            auth: { type: string }

    ChapterRef:
      type: object
      description: A chapter's place in its course. Stored in the course manifest and copied into the chapter's `topic.json`.
      required: [course_id, kind, order]
      properties:
        course_id: { type: string }
        kind: { type: string, enum: [chapter, prelim] }
        order: { type: integer, description: 'Position in the course, from 1. The Prelim is 0.' }
        summary: { type: [string, 'null'], description: One or two sentences on what the chapter covers }
        prereqs:
          type: array
          description: Chapter topic ids. Advisory, never a lock.
          items: { type: string }
        teaches:
          type: array
          description: Concepts this chapter explains. Added to the person profile when the chapter is marked done.
          items: { type: string }
        assumes:
          type: array
          description: Concepts the chapter takes for granted. Anything no finished prerequisite covers is asked about.
          items: { type: string }
        source_range:
          description: Where in the course's central resources this chapter's material is.
          oneOf:
            - $ref: '#/components/schemas/SourceRange'
            - type: 'null'

    CourseChapter:
      type: object
      description: A chapter as listed in `course.json`. Its `id` is the chapter's topic id.
      required: [id, title, kind, order, prereqs, teaches, assumes]
      properties:
        id: { type: string }
        title: { type: string }
        kind: { type: string, enum: [chapter, prelim] }
        order: { type: integer }
        summary: { type: [string, 'null'] }
        prereqs:
          type: array
          items: { type: string }
        teaches:
          type: array
          items: { type: string }
        assumes:
          type: array
          items: { type: string }
        source_range:
          oneOf:
            - $ref: '#/components/schemas/SourceRange'
            - type: 'null'

    SourceRange:
      type: object
      required: [label]
      properties:
        source: { type: [string, 'null'], description: 'Path of the central resource relative to the course folder (sources/ddia.pdf), a URL, or null when the chapter has no single source' }
        label: { type: string, description: 'Human text, for example "pp. 17 to 45" or "Chapter 3"' }
        from: { type: [integer, 'null'], description: First page }
        to: { type: [integer, 'null'], description: Last page }

    CourseStatus:
      type: string
      description: |
        captured: just added. planning: the outline job is running or waiting for approval. ready: the outline is
        approved and chapters exist. failed: the outline job failed.
      enum: [captured, planning, ready, failed, archived]

    Course:
      type: object
      description: The course manifest (`course.json`) as the server sees it.
      required: [id, title, status, origin, chapters, sources, created, updated]
      properties:
        id: { type: string }
        title: { type: string }
        goal: { type: [string, 'null'], description: Free text from the learner }
        status: { $ref: '#/components/schemas/CourseStatus' }
        origin: { $ref: '#/components/schemas/Origin' }
        summary: { type: [string, 'null'] }
        chapters:
          type: array
          description: In study order, the Prelim first when there is one.
          items: { $ref: '#/components/schemas/CourseChapter' }
        sources:
          type: array
          description: Central resources, derived from the course's `sources/` folder.
          items:
            type: object
            required: [path, title]
            properties:
              path: { type: string, description: Relative to the course folder }
              title: { type: string }
              url: { type: [string, 'null'] }
        failure_reason: { type: [string, 'null'] }
        session_id: { type: [string, 'null'] }
        session_cli:
          oneOf:
            - $ref: '#/components/schemas/CliId'
            - type: 'null'
        created: { type: string }
        updated: { type: string }

    ChapterState:
      type: string
      description: planned (a shell with no pack), building, ready (pack built, not started), in_progress, done.
      enum: [planned, building, ready, in_progress, done]

    ChapterView:
      type: object
      required: [id, title, kind, order, state, topic, prereqs, unmet_prereqs]
      properties:
        id: { type: string }
        title: { type: string }
        kind: { type: string, enum: [chapter, prelim] }
        order: { type: integer }
        summary: { type: [string, 'null'] }
        state: { $ref: '#/components/schemas/ChapterState' }
        prereqs:
          type: array
          items: { type: string }
        unmet_prereqs:
          type: array
          description: Prerequisite chapter ids that are not done yet. Advisory.
          items: { type: string }
        teaches:
          type: array
          items: { type: string }
        source_range:
          oneOf:
            - $ref: '#/components/schemas/SourceRange'
            - type: 'null'
        topic: { $ref: '#/components/schemas/TopicSummary' }

    CourseSummary:
      type: object
      required: [id, title, status, origin, counts, progress, updated]
      properties:
        id: { type: string }
        title: { type: string }
        status: { $ref: '#/components/schemas/CourseStatus' }
        origin: { $ref: '#/components/schemas/Origin' }
        summary: { type: [string, 'null'] }
        counts:
          type: object
          required: [chapters, built, done]
          properties:
            chapters: { type: integer }
            built: { type: integer, description: Chapters with a pack }
            done: { type: integer }
        progress:
          type: object
          required: [fraction]
          properties:
            fraction: { type: number, description: 'Chapters done over chapters, 0 to 1' }
        next_chapter:
          description: The first chapter not done, in course order.
          oneOf:
            - type: object
              required: [id, title, state]
              properties:
                id: { type: string }
                title: { type: string }
                state: { $ref: '#/components/schemas/ChapterState' }
            - type: 'null'
        failure_reason: { type: [string, 'null'] }
        active_job:
          oneOf:
            - $ref: '#/components/schemas/Job'
            - type: 'null'
        updated: { type: string }

    CourseList:
      type: object
      required: [courses]
      properties:
        courses:
          type: array
          items: { $ref: '#/components/schemas/CourseSummary' }

    CourseDetail:
      type: object
      required: [course, chapters, jobs, chat_available, estimate]
      properties:
        course: { $ref: '#/components/schemas/Course' }
        chapters:
          type: array
          items: { $ref: '#/components/schemas/ChapterView' }
        jobs:
          type: array
          description: Active jobs first (the outline job, chapter builds), then recent finished ones
          items: { $ref: '#/components/schemas/Job' }
        chat_available: { type: boolean }
        chat_unavailable_reason: { type: [string, 'null'] }
        estimate:
          type: object
          description: What building the rest costs, so the learner can choose how many to build.
          required: [planned_chapters]
          properties:
            planned_chapters: { type: integer, description: 'Chapters with no pack yet, each one enrich run' }

    CreateCourse:
      type: object
      required: [origin]
      properties:
        origin:
          type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [link, topic]
            link: { type: string, format: uri }
            name: { type: string, minLength: 2 }
        title: { type: string }
        goal: { type: string }

    CourseWithJob:
      type: object
      required: [course, job]
      properties:
        course: { $ref: '#/components/schemas/Course' }
        job:
          oneOf:
            - $ref: '#/components/schemas/Job'
            - type: 'null'

    UpdateCourse:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        goal: { type: string }
        archived: { type: boolean }

    BuildChapters:
      type: object
      properties:
        chapter_ids:
          type: array
          items: { type: string }
        next:
          type: integer
          minimum: 1
          maximum: 20
          description: Build the next N planned chapters in course order

    QuizQuestion:
      type: object
      required: [id, type, prompt]
      properties:
        id: { type: string }
        type:
          type: string
          description: choice is graded on the server; the others by a grading job
          enum: [choice, short, explain, spot_error]
        prompt: { type: string, description: Markdown }
        options:
          type: array
          description: For choice questions
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string }
              label: { type: string }
        concept: { type: [string, 'null'], description: The concept this question tests }
        section: { type: [string, 'null'], description: 'Pack section id to reread, for the Reader' }
        chapter_id: { type: [string, 'null'], description: 'In a course quiz, the chapter the question draws from' }

    QuestionResult:
      type: object
      required: [score]
      properties:
        score: { type: number, description: 0 to 1 }
        correct: { type: [boolean, 'null'] }
        feedback: { type: [string, 'null'] }
        correct_option: { type: [string, 'null'] }
        explanation: { type: [string, 'null'] }

    QuizAttempt:
      type: object
      required: [id, status, created, answers]
      properties:
        id: { type: string }
        status: { type: string, enum: [grading, graded, failed] }
        created: { type: string }
        answers:
          type: object
          additionalProperties:
            type: object
            properties:
              selected: { type: [string, 'null'] }
              text: { type: [string, 'null'] }
        results:
          type: object
          additionalProperties: { $ref: '#/components/schemas/QuestionResult' }
        score: { type: [number, 'null'], description: '0 to 1 over all questions, null while grading' }
        weak_concepts:
          type: array
          items: { type: string }
        job_id: { type: [string, 'null'] }

    Quiz:
      type: object
      required: [id, title, status, scope, questions, attempts, created]
      properties:
        id: { type: string }
        title: { type: string }
        status: { type: string, enum: [generating, ready, failed] }
        scope: { type: string, description: The topic id or course scope id }
        focus: { type: [string, 'null'] }
        failure_reason: { type: [string, 'null'] }
        questions:
          type: array
          items: { $ref: '#/components/schemas/QuizQuestion' }
        attempts:
          type: array
          items: { $ref: '#/components/schemas/QuizAttempt' }
        created: { type: string }

    QuizList:
      type: object
      required: [quizzes]
      properties:
        quizzes:
          type: array
          items: { $ref: '#/components/schemas/Quiz' }

    CreateQuiz:
      type: object
      properties:
        count: { type: integer, minimum: 3, maximum: 20, default: 8 }
        focus: { type: string, description: A concept or section to concentrate on }
        chapter_ids:
          type: array
          description: For a course quiz, limit it to these chapters. Default is every finished chapter.
          items: { type: string }

    QuizWithJob:
      type: object
      required: [quiz, job]
      properties:
        quiz: { $ref: '#/components/schemas/Quiz' }
        job: { $ref: '#/components/schemas/Job' }

    SubmitAttempt:
      type: object
      required: [answers]
      properties:
        answers:
          type: object
          additionalProperties:
            type: object
            properties:
              selected: { type: [string, 'null'] }
              text: { type: [string, 'null'] }

    AssignmentBrief:
      type: object
      required: [title, task]
      properties:
        title: { type: string }
        summary: { type: [string, 'null'] }
        task: { type: string, description: Markdown }
        constraints:
          type: array
          items: { type: string }
        acceptance:
          type: array
          items:
            type: object
            required: [id, text]
            properties:
              id: { type: string }
              text: { type: string }
        stretch: { type: [string, 'null'] }
        estimate: { type: [string, 'null'], description: 'For example "2 to 3 hours"' }
        grounded_in: { type: [string, 'null'], description: One line on how the learner's context shaped the task }

    CriterionReview:
      type: object
      required: [id, met]
      properties:
        id: { type: string }
        met: { type: string, enum: [yes, partly, no] }
        feedback: { type: [string, 'null'] }

    Review:
      type: object
      required: [summary, criteria]
      properties:
        summary: { type: string }
        criteria:
          type: array
          items: { $ref: '#/components/schemas/CriterionReview' }
        next_steps:
          type: array
          items: { type: string }
        pointers:
          type: array
          description: Where to reread what was missed
          items:
            type: object
            required: [label]
            properties:
              label: { type: string }
              section: { type: [string, 'null'] }

    Submission:
      type: object
      required: [id, kind, status, created]
      properties:
        id: { type: string }
        kind: { type: string, enum: [text, link, file] }
        text: { type: [string, 'null'] }
        link: { type: [string, 'null'] }
        file: { type: [string, 'null'], description: Path relative to the topic folder }
        status: { type: string, enum: [submitted, reviewing, reviewed, failed] }
        review:
          oneOf:
            - $ref: '#/components/schemas/Review'
            - type: 'null'
        job_id: { type: [string, 'null'] }
        created: { type: string }

    Assignment:
      type: object
      required: [id, title, status, submissions, created]
      properties:
        id: { type: string }
        title: { type: string }
        status: { type: string, enum: [briefing, open, failed] }
        failure_reason: { type: [string, 'null'] }
        context:
          description: What the learner gave to make the task relevant, or null for a generic task.
          oneOf:
            - type: object
              properties:
                text: { type: [string, 'null'] }
                link: { type: [string, 'null'] }
                file: { type: [string, 'null'] }
            - type: 'null'
        brief:
          oneOf:
            - $ref: '#/components/schemas/AssignmentBrief'
            - type: 'null'
        submissions:
          type: array
          items: { $ref: '#/components/schemas/Submission' }
        job_id: { type: [string, 'null'] }
        created: { type: string }

    AssignmentList:
      type: object
      required: [assignments]
      properties:
        assignments:
          type: array
          items: { $ref: '#/components/schemas/Assignment' }

    CreateAssignment:
      type: object
      properties:
        context_text: { type: string }
        context_link: { type: string, format: uri }
        focus: { type: string }

    AssignmentWithJob:
      type: object
      required: [assignment, job]
      properties:
        assignment: { $ref: '#/components/schemas/Assignment' }
        job: { $ref: '#/components/schemas/Job' }

    CreateSubmission:
      type: object
      properties:
        text: { type: string }
        link: { type: string, format: uri }

    EventType:
      type: string
      enum: [resync, job.updated, job.log, chat.delta, chat.message, topic.updated, topic.removed, inbox.updated]

    Event:
      type: object
      description: The JSON in an SSE `data:` line. `id` repeats the SSE id.
      required: [id, type, at, data]
      properties:
        id: { type: integer }
        type: { $ref: '#/components/schemas/EventType' }
        at: { type: string, format: date-time }
        data:
          anyOf:
            - $ref: '#/components/schemas/JobUpdatedData'
            - $ref: '#/components/schemas/JobLogData'
            - $ref: '#/components/schemas/ChatDeltaData'
            - $ref: '#/components/schemas/ChatMessageData'
            - $ref: '#/components/schemas/TopicEventData'
            - type: object

    JobUpdatedData:
      type: object
      required: [job]
      properties:
        job: { $ref: '#/components/schemas/Job' }

